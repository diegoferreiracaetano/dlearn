name: Verificação de Estilo com Detekt

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Lê o design system publicado no GitHub Packages de outro repositório. O settings.gradle.kts
# usa GITHUB_ACTOR e GITHUB_TOKEN; o token vem do secret GPR_KEY (classic, read:packages).
env:
  GITHUB_TOKEN: ${{ secrets.GPR_KEY }}

jobs:
  detekt-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Run Detekt
        run: ./gradlew detektAll
