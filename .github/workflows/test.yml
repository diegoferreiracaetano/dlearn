name: CI Pipeline (Lint & Test)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# Lê o design system publicado no GitHub Packages de outro repositório. O settings.gradle.kts
# usa GITHUB_ACTOR e GITHUB_TOKEN; o token vem do secret GPR_KEY (classic, read:packages).
# O gradle.properties do projeto é ignorado pelo git e não existe no runner, então a memória
# do Gradle e do Kotlin é definida aqui (o padrão de 512 MB estoura ao compilar o composeApp).
env:
  GITHUB_TOKEN: ${{ secrets.GPR_KEY }}
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Dorg.gradle.project.kotlin.daemon.jvmargs=-Xmx3g

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar credencial do GitHub Packages
        run: bash .github/scripts/check-packages-credential.sh
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run Detekt
        # O detektAll roda em todos os módulos conforme definido no build.gradle.kts raiz
        run: |
          set -o pipefail
          ./gradlew detektAll --stacktrace -Pandroid.useAndroidX=true 2>&1 | tee gradle.log
      - name: Resumir erro do Gradle
        if: failure()
        run: |
          msg=$(grep -E "What went wrong|Could not|FAILED|^e: |\.kt:[0-9]+:[0-9]+|Execution failed" -A3 gradle.log | head -40 | cut -c1-220 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3500)
          echo "::error title=Resumo do erro do Gradle::${msg}"

  unit-tests:
    name: Unit Tests (Server, Shared & App)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run All Unit Tests
        # Executa testes do Server, Shared (JVM/Android) e App (Android Unit)
        run: ./gradlew :server:test :shared:testDebugUnitTest :shared:jvmTest :composeApp:testDebugUnitTest --no-daemon --stacktrace -Pandroid.useAndroidX=true
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

  android-instrumented-tests:
    name: Android Instrumented Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    # Se o emulador travar, o job para aqui em vez de ocupar o runner por horas.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Enable KVM
        # Sem KVM o emulador x86_64 fica lento demais e o adb o marca como "offline".
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build test APKs
        # Compila antes de subir o emulador, para ele não ficar parado esperando o Gradle.
        run: ./gradlew :composeApp:assembleDebug :composeApp:assembleDebugAndroidTest -Pandroid.useAndroidX=true

      - name: Run Emulator and Instrumented Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          emulator-boot-timeout: 900
          # Roda testes instrumentados no App (UI principal)
          script: ./gradlew :composeApp:connectedDebugAndroidTest -Pandroid.useAndroidX=true

      - name: Resumir falhas dos testes instrumentados
        if: failure()
        run: python3 .github/scripts/summarize-android-tests.py

  coverage:
    name: Coverage Report
    needs: [unit-tests, android-instrumented-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      
      - name: Generate Coverage Reports
        # Gera relatórios via Kover e Jacoco (usando seu script customizado)
        run: ./gradlew koverXmlReport jacocoAndroidTestReport --continue -Pandroid.useAndroidX=true || echo "Some reports failed"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            **/build/reports/kover
            **/build/reports/jacoco
            **/build/test-results
